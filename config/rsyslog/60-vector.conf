# Reenvío de los logs del firewall (UFW / iptables) a Vector.
#
# Instalación en el firewall:
#   1. sudo ufw logging on
#   2. Copiar este archivo a /etc/rsyslog.d/60-vector.conf
#   3. Sustituir IP_DE_VECTOR por la IP de la máquina donde corre Vector
#   4. sudo systemctl restart rsyslog
#
# Solo se reenvían las líneas de UFW. "@@" significa TCP ("@" sería UDP).

:msg, contains, "[UFW " @@IP_DE_VECTOR:5514
